<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- 时钟外圈 -->
  <circle cx="12" cy="12" r="9" />

  <!-- 四个方向的刻度：极大地增加视觉稳定性 -->
  <path d="M12 3v1.5" />
  <path d="M12 19.5V21" />
  <path d="M3 12h1.5" />
  <path d="M19.5 12H21" />

  <!-- 内部循环箭头：完美对称的半圆 (青蓝色) -->
  <g stroke="#06b6d4">
    <!-- 上半圆弧 -->
    <path d="M 8 12 A 4 4 0 0 1 16 12" />
    <!-- 右侧箭头 (指向下) -->
    <path d="M 16 12 L 14 10 M 16 12 L 14 14" />

    <!-- 下半圆弧 -->
    <path d="M 16 12 A 4 4 0 0 1 8 12" />
    <!-- 左侧箭头 (指向上) -->
    <path d="M 8 12 L 10 10 M 8 12 L 10 14" />
  </g>
</svg>